<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regression Evaluation Metrics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations for dynamic feel */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SVG Animation Classes */
        .draw-line {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawLine 1s forwards ease-out;
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        .grow-rect {
            transform-box: fill-box;
            transform-origin: center;
            animation: growRect 0.6s forwards ease-out;
        }

        @keyframes growRect {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 0.2;
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div
        class="bg-white max-w-5xl w-full rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col h-[85vh] min-h-[700px]">

        <!-- Header & Progress -->
        <header class="p-6 border-b border-slate-100 bg-white z-10">
            <h1 class="text-2xl font-bold text-slate-800">Regression Evaluation Metrics</h1>
            <p class="text-slate-500 text-sm mt-1">Understanding how we measure the accuracy of our predictions.</p>

            <!-- Progress Bar -->
            <div class="mt-4 w-full bg-slate-100 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500"
                    style="width: 0%"></div>
            </div>
            <!-- <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium" id="step-indicators">

            </div> -->
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-white">

            <!-- Left: Visualization (SVG) -->
            <div id="visual-container"
                class="lg:w-3/5 p-6 sm:p-10 flex items-center justify-center bg-slate-50/50 border-b lg:border-b-0 lg:border-r border-slate-100 relative">
                <!-- Default Grid and Graph Setup -->
                <svg id="chart-svg" viewBox="-10 -10 120 120"
                    class="w-full h-full max-h-[400px] drop-shadow-sm overflow-visible text-slate-800">
                    <!-- Dynamic content will be injected here -->
                </svg>

                <!-- Equations Container (Hidden by default) -->
                <div id="equations-container" class="hidden w-full h-full p-4 overflow-y-auto">
                    <!-- Equations will be injected here -->
                </div>
            </div>

            <!-- Right: Explanations -->
            <div
                class="lg:w-2/5 p-8 flex flex-col justify-center bg-white z-10 shadow-[-10px_0_15px_-5px_rgba(0,0,0,0.02)]">
                <div id="text-content" class="fade-in">
                    <span id="step-badge"
                        class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full mb-4 uppercase tracking-wider"></span>
                    <h2 id="step-title" class="text-3xl font-bold text-slate-800 mb-4 leading-tight"></h2>
                    <p id="step-desc" class="text-slate-600 text-lg leading-relaxed"></p>

                    <div id="extra-info"
                        class="mt-6 p-4 bg-slate-50 border border-slate-100 rounded-lg text-sm text-slate-600 hidden">
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer / Navigation -->
        <footer class="p-4 sm:p-6 border-t border-slate-100 bg-white flex justify-between items-center z-10">
            <button id="btn-back"
                class="px-6 py-2.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                &larr; Back
            </button>
            <div id="step-counter" class="text-slate-400 font-medium text-sm">Step 1 of X</div>
            <button id="btn-next"
                class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-medium shadow-sm hover:bg-blue-700 hover:shadow transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                Next &rarr;
            </button>
        </footer>
    </div>

    <script src="../js/regression_evaluation_metric.js"></script>
</body>

</html>
