<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression Simplified</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS for elegant LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        /* Ensuring crisp canvas rendering */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-2xl shadow-xl max-w-5xl w-full overflow-hidden border border-slate-200">

        <!-- Header -->
        <div class="bg-white border-b border-slate-100 px-8 py-6">
            <h1 class="text-3xl font-bold text-slate-900">Linear Regression Explained</h1>
            <p class="text-slate-500 mt-2 text-lg">A simple, step-by-step visual guide to understanding how machines
                learn to draw the line of best fit.</p>
        </div>

        <!-- Main Content Area -->
        <div class="flex flex-col md:flex-row p-8 gap-10">

            <!-- Visualization Canvas -->
            <div class="flex-1 flex flex-col items-center justify-center">
                <div
                    class="relative bg-slate-50 rounded-xl border border-slate-200 p-4 shadow-inner w-full flex items-center justify-center min-h-[450px]">
                    <!-- Added inline script for responsiveness later -->
                    <canvas id="lrCanvas" width="500" height="500"
                        class="w-full max-w-[450px] h-auto rounded bg-white shadow-sm"></canvas>

                    <!-- LaTeX Overlay (Hidden by default) -->
                    <div id="latexOverlay"
                        class="hidden absolute inset-0 bg-white m-4 rounded-lg shadow-sm flex-col items-center justify-start py-6 px-4 text-center overflow-y-auto z-10">
                        <h3 class="text-xl font-bold text-slate-800 mb-2 shrink-0">Mathematical Formulas</h3>
                        <div id="mathPrediction" class="text-blue-600 mb-4 w-full overflow-x-auto shrink-0"></div>
                        <div id="mathMeans" class="text-slate-700 text-sm mb-4 w-full overflow-x-auto shrink-0"></div>
                        <div id="mathSlope" class="text-slate-700 text-sm mb-4 w-full overflow-x-auto shrink-0"></div>
                        <div id="mathIntercept" class="text-slate-700 text-sm mb-6 w-full overflow-x-auto shrink-0">
                        </div>

                        <div class="w-full h-px bg-slate-200 mb-6 mt-2 shrink-0"></div>

                        <h3 class="text-lg font-bold text-slate-800 mb-2 shrink-0">Example Calculation</h3>
                        <div id="mathEx1" class="text-slate-600 mb-2 w-full overflow-x-auto shrink-0"></div>
                        <div id="mathEx2" class="text-green-600 mb-2 w-full overflow-x-auto shrink-0"></div>
                        <div id="mathEx3" class="text-orange-600 font-bold w-full overflow-x-auto shrink-0 pb-4"></div>
                    </div>
                </div>
                <!-- Updated Axis Labels to match Student Theme -->
                <div id="axisLabels"
                    class="text-sm font-medium text-slate-500 mt-4 text-center w-full bg-slate-100 py-2 rounded-lg transition-opacity duration-300">
                    X-Axis: <span class="text-slate-800">Hours Studied</span> &nbsp;&nbsp;|&nbsp;&nbsp; Y-Axis: <span
                        class="text-slate-800">Exam Score (%)</span>
                </div>
            </div>

            <!-- Context & Controls Area -->
            <div class="flex-1 flex flex-col justify-between">

                <div class="min-h-[260px]">
                    <!-- Step Indicator -->
                    <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-sm font-bold tracking-wide rounded-full mb-4"
                        id="stepIndicator">
                        Step 1 of 8
                    </div>

                    <!-- Dynamic Content -->
                    <h2 class="text-2xl font-bold text-slate-800 mb-4 transition-all duration-300" id="stepTitle">
                        Meet the Data
                    </h2>
                    <p class="text-slate-600 text-lg leading-relaxed transition-all duration-300" id="stepDescription">
                        Loading...
                    </p>
                </div>

                <!-- Navigation Controls -->
                <div class="mt-8 flex items-center justify-between border-t border-slate-100 pt-6">
                    <button id="btnPrev"
                        class="px-5 py-2.5 bg-white border-2 border-slate-200 text-slate-600 font-semibold rounded-lg hover:bg-slate-50 hover:border-slate-300 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        &larr; Previous
                    </button>

                    <!-- Progress Dots -->
                    <div class="flex gap-2" id="progressDots">
                        <!-- Dots injected by JS -->
                    </div>

                    <button id="btnNext"
                        class="px-5 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 shadow-md shadow-blue-600/20 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                        Next Step &rarr;
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/linear_regression.js"></script>
</body>

</html>
